services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: sarusystems_os
      POSTGRES_USER: sarusystems
      POSTGRES_PASSWORD: sarusystems
    ports:
      - "5432:5432"
    volumes:
      - sarusystems-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarusystems -d sarusystems_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sarusystems-postgres:

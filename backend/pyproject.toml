[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sarusystems-os-backend"
version = "0.1.0"
description = "SaruSystems OS backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.15,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.7,<3.0",
  "email-validator>=2.2,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "PyJWT>=2.10,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "httpx>=0.28,<1.0",
  "ruff>=0.9,<1.0",
]

[tool.setuptools]
packages = [
  "app", "app.ai_assistant", "app.analytics", "app.audit", "app.auth", "app.calendar", "app.clients",
  "app.command_center", "app.communication", "app.company", "app.content", "app.core",
  "app.crm", "app.documents", "app.finance", "app.freelancer_work", "app.freelancers",
  "app.global_search", "app.marketing", "app.notifications", "app.products", "app.projects",
  "app.roles", "app.rules", "app.sales", "app.services", "app.shared", "app.social_media",
  "app.tasks", "app.users",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
